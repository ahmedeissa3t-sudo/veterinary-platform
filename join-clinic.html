<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انضم كعيادة - VetCare 🏥</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --page-bg:#f4faf8;
    --card-bg:#ffffff;
    --mint:#dbf1ec;
    --text-dark:#0b3d3a;
    --text-body:#155a54;
    --accent:#0f766e;
    --muted:#6f938f;
    --border:#e3f1ee;
  }
  *{box-sizing:border-box; font-family:'Tajawal', sans-serif;}
  body{background:var(--page-bg); margin:0; padding:24px 16px; color:var(--text-dark);}
  .wrap{max-width:460px; margin:0 auto;}

  .back-link{color:var(--muted); text-decoration:none; font-size:14px; display:inline-block; margin-bottom:18px;}

  .card{background:var(--card-bg); border-radius:24px; padding:26px 22px; box-shadow:0 10px 30px rgba(15,118,110,0.08); margin-bottom:16px;}
  .card h2{margin:0 0 6px; font-size:21px; text-align:center;}
  .card p.sub{margin:0 0 20px; font-size:13px; color:var(--muted); text-align:center;}

  label{font-size:13px; font-weight:700; display:block; margin-top:14px; margin-bottom:6px;}
  input, textarea, select{
    width:100%; padding:12px; border:1px solid var(--border); border-radius:12px;
    background:#fbfefd; color:var(--text-dark); font-size:14px; outline:none;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}

  .btn-main{
    width:100%; padding:14px; border:none; border-radius:14px; margin-top:20px;
    background:var(--accent); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .btn-main:disabled{opacity:.6;}

  .status-box{display:none; margin-top:16px; padding:14px; border-radius:12px; background:var(--mint); color:var(--accent); font-weight:700; text-align:center; font-size:14px;}
  .error-box{display:none; margin-top:16px; padding:14px; border-radius:12px; background:#fdeceb; color:#c0392b; font-weight:700; text-align:center; font-size:13px;}
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="services.html">→ رجوع للخدمات</a>

  <div class="card">
    <h2>🏥 انضم كعيادة على VetCare</h2>
    <p class="sub">سجّل عيادتك عشان تستقبل حالات جديدة من صحاب الحيوانات مباشرة.</p>

    <label>اسم العيادة</label>
    <input type="text" id="clinicName" placeholder="مثال: عيادة النور البيطرية">

    <label>اسم الطبيب المسؤول</label>
    <input type="text" id="doctorName" placeholder="مثال: د. أحمد سامي">

    <label>التخصص</label>
    <select id="specialty">
      <option value="عام">عيادة عامة</option>
      <option value="حيوانات أليفة">حيوانات أليفة (قطط وكلاب)</option>
      <option value="طيور وزواحف">طيور وزواحف</option>
      <option value="حيوانات مزرعة">حيوانات مزرعة وماشية</option>
      <option value="خيول">خيول</option>
      <option value="طوارئ">طوارئ على مدار الساعة</option>
    </select>

    <label>العنوان بالتفصيل</label>
    <textarea id="address" rows="2" placeholder="المحافظة، الحي، اسم الشارع"></textarea>

    <label>رقم الهاتف</label>
    <input type="tel" id="phone" placeholder="مثال: 01000000000">

    <label>ملاحظات إضافية (اختياري)</label>
    <textarea id="notes" rows="2" placeholder="مواعيد العمل، خدمات مميزة، إلخ"></textarea>

    <button class="btn-main" id="submitBtn" onclick="submitClinic()">إرسال طلب الانضمام 🚀</button>

    <div id="status" class="status-box"></div>
    <div id="errorBox" class="error-box"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://tuyvjozypjcvgpgkfoby.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_tJeAmG5w9tJth0rkMmwyrw_Ebel2qit';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function submitClinic(){
    const clinicName = document.getElementById('clinicName').value.trim();
    const doctorName = document.getElementById('doctorName').value.trim();
    const specialty = document.getElementById('specialty').value;
    const address = document.getElementById('address').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const notes = document.getElementById('notes').value.trim();

    const btn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('status');
    const errorBox = document.getElementById('errorBox');
    statusBox.style.display = 'none';
    errorBox.style.display = 'none';

    if(!clinicName || !doctorName || !address || !phone){
      errorBox.style.display = 'block';
      errorBox.textContent = '⚠️ من فضلك اكتب اسم العيادة، اسم الطبيب، العنوان، ورقم الهاتف.';
      return;
    }
    if(phone.length < 8){
      errorBox.style.display = 'block';
      errorBox.textContent = '⚠️ اكتب رقم هاتف صحيح.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'جاري الإرسال...';

    const { error } = await _supabase.from('clinics').insert([{
      clinic_name: clinicName,
      doctor_name: doctorName,
      specialty: specialty,
      address: address,
      phone: phone,
      notes: notes || null,
      status: 'قيد المراجعة'
    }]);

    btn.disabled = false;
    btn.textContent = 'إرسال طلب الانضمام 🚀';

    if(error){
      errorBox.style.display = 'block';
      errorBox.textContent = '❌ حصل خطأ أثناء الإرسال: ' + error.message;
      return;
    }

    statusBox.style.display = 'block';
    statusBox.textContent = '✅ تم استلام طلبك! هيتم مراجعته والتواصل معاك قريبًا.';

    document.getElementById('clinicName').value = '';
    document.getElementById('doctorName').value = '';
    document.getElementById('address').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('notes').value = '';
  }
</script>

</body>
</html>
