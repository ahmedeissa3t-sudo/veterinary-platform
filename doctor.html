<!DOCTYPE html>

    <style>

        #dashboard {

        table {
            width: 100%;

            margin-top: 15px;
            min-width: 850px;
        }

        th,

            border: 1px solid #ddd;
            padding: 9px;
            font-size: 13px;
            vertical-align: middle;
        }

        th {
            background: #2c3e50;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .approve-btn {
            background: #2980b9;
            width: auto;
            padding: 7px 12px;
            font-size: 12px;
            margin: 2px;
        }

        .reject-btn {
            background: #c0392b;

            padding: 7px 12px;

        }

        .status-approved {
            color: #27ae60;

            font-weight: bold;

        .status-working {

        }

            background: #7f8c8d;
            width: auto;
            padding: 8px 18px;
            margin-bottom: 15px;
        }

        .message {
            padding: 15px;
            font-weight: bold;
        }

        }

        .success {

    </style>
</head>

<body>

<script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
        'https://tuyvjozypjcvgpgkfoby.supabase.co';

    const SUPABASE_KEY =
        'sb_publishable_tJeAmG5w9tJth0rkMmwyrw_Ebel2qit';

    const _supabase =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       LOGIN
    ========================= */

    function login() {

        const pass =
            document.getElementById('passInput').value.trim();

        if (pass === 'vetcare2026#') {

            localStorage.setItem(
                'vetcare_doctor_login',
                'true'
            );

            document.getElementById('loginCard').style.display = 'none';

            document.getElementById('dashboard').style.display = 'block';

            loadCases();
            loadClinics();

        } else {

            alert('❌ كلمة السر غير صحيحة');

        }

    }


    /* =========================
       AUTO LOGIN
    ========================= */

    window.addEventListener('DOMContentLoaded', function () {

        const loggedIn =
            localStorage.getItem('vetcare_doctor_login');

        if (loggedIn === 'true') {

            document.getElementById('loginCard').style.display = 'none';

            document.getElementById('dashboard').style.display = 'block';

            loadCases();
            loadClinics();

        }

    });


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

        localStorage.removeItem(
            'vetcare_doctor_login'
        );

        location.reload();

    }


    /* =========================
       TABS
    ========================= */

    function switchTab(tab) {

        document
            .getElementById('tab-cases')
            .classList.toggle(
                'active',
                tab === 'cases'
            );

        document
            .getElementById('tab-clinics')
            .classList.toggle(
                'active',
                tab === 'clinics'
            );

        document
            .getElementById('tabCasesBtn')
            .classList.toggle(
                'active',
                tab === 'cases'
            );

        document
            .getElementById('tabClinicsBtn')
            .classList.toggle(
                'active',
                tab === 'clinics'
            );

    }


    /* =========================
       SAFE TEXT
    ========================= */

    function safe(value) {

        if (
            value === null ||
            value === undefined ||
            value === ''
        ) {
            return '-';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

    }


    /* =========================
       CASE STATUS COLOR
    ========================= */

    function caseStatus(status) {

        const value =
            status || 'قيد الانتظار';

        let className =
            'status-pending';

        if (
            value === 'جاري التواصل' ||
            value === 'تم الرد'
        ) {
            className = 'status-working';
        }

        if (value === 'مغلقة') {
            className = 'status-approved';
        }

        return `
            <span class="${className}">
                ${safe(value)}
            </span>
        `;

    }


    /* =========================
       CLINIC STATUS
    ========================= */

    function clinicStatus(status) {

        const value =
            status || 'قيد المراجعة';

        if (value === 'مقبولة') {

            return `
                <span class="status-approved">
                    ✅ مقبولة
                </span>
            `;

        }

        if (value === 'مرفوضة') {

            return `
                <span class="status-rejected">
                    ❌ مرفوضة
                </span>
            `;

        }

        return `
            <span class="status-pending">
                ⏳ قيد المراجعة
            </span>
        `;

    }


    /* =========================
       LOAD CASES
    ========================= */

    async function loadCases() {

        const tbody =
            document.getElementById('casesTable');

        tbody.innerHTML = `
            <tr>
                <td colspan="9">
                    ⏳ جاري جلب الحالات...
                </td>
            </tr>
        `;

        try {

            const {
                data,
                error
            } = await _supabase
                .from('cases')
                .select('*');

            if (error) {
                throw error;
            }

            if (!data || data.length === 0) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="9">
                            لا توجد حالات مسجلة حتى الآن
                        </td>
                    </tr>
                `;

                return;
            }


            /* الأحدث أولاً */
            data.sort(function(a, b) {

                const dateA =
                    new Date(
                        a.created_at || 0
                    ).getTime();

                const dateB =
                    new Date(
                        b.created_at || 0
                    ).getTime();

                return dateB - dateA;

            });


            tbody.innerHTML = '';


            data.forEach(function(c) {

                const id =
                    c.id;

                tbody.innerHTML += `

                    <tr>

                        <td>
                            <b>
                                ${safe(c.order_number)}
                            </b>
                        </td>

                        <td>
                            ${safe(c.owner_name)}
                        </td>

                        <td>
                            ${safe(c.phone)}
                        </td>

                        <td>
                            ${safe(c.animal_type)}

                            ${
                                c.pet_name
                                ? ' (' + safe(c.pet_name) + ')'
                                : ''
                            }
                        </td>

                        <td>
                            ${safe(c.doctor_name)}
                        </td>

                        <td>
                            ${safe(c.service_type)}
                        </td>

                        <td>
                            ${safe(c.description)}
                        </td>

                        <td>
                            ${caseStatus(c.status)}
                        </td>

                        <td>

                            <select
                                onchange="updateCaseStatus('${String(id).replace(/'/g, "\\'")}', this.value)"
                            >

                                <option value="" selected disabled>
                                    تغيير...
                                </option>

                                <option value="قيد الانتظار">
                                    قيد الانتظار
                                </option>

                                <option value="جاري التواصل">
                                    جاري التواصل
                                </option>

                                <option value="تم الرد">
                                    تم الرد
                                </option>

                                <option value="مغلقة">
                                    مغلقة
                                </option>

                            </select>

                        </td>

                    </tr>

                `;

            });

        }

        catch (err) {

            console.error(err);

            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="error">
                        ❌ خطأ في تحميل الحالات:
                        ${safe(err.message)}
                    </td>
                </tr>
            `;

        }

    }


    /* =========================
       UPDATE CASE
    ========================= */

    async function updateCaseStatus(
        id,
        newStatus
    ) {

        if (!newStatus) {
            return;
        }

        try {

            const {
                error
            } = await _supabase
                .from('cases')
                .update({
                    status: newStatus
                })
                .eq('id', id);

            if (error) {
                throw error;
            }

            await loadCases();

        }

        catch (err) {

            alert(
                '❌ خطأ في تحديث الحالة: ' +
                err.message
            );

        }

    }

       LOAD CLINICS
    ========================= */

        const tbody =

        tbody.innerHTML = `

            if (!data || data.length === 0) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            لا توجد عيادات مسجلة حتى الآن
                        </td>
                    </tr>
                `;

                return;
            }


            data.sort(function(a, b) {

                const dateA =
                    new Date(
                        a.created_at || 0
                    ).getTime();

                const dateB =
                    new Date(
                        b.created_at || 0
                    ).getTime();

                return dateB - dateA;

            });


            tbody.innerHTML = '';


            data.forEach(function(c) {

                const id =
                    c.id;

                const status =
                    c.status || 'قيد المراجعة';


                let action = '';


                if (status === 'مقبولة') {

                    action = `
                        <span class="success">
                            ✅ تم قبول العيادة
                        </span>
                    `;

                }

                else if (status === 'مرفوضة') {

                    action = `
                        <button
                            class="approve-btn"
                            onclick="updateClinicStatus('${String(id).replace(/'/g, "\\'")}', 'مقبولة')"
                        >
                            إعادة قبول
                        </button>
                    `;

                }

                else {

                    action = `

                        <button
                            class="approve-btn"
                            onclick="updateClinicStatus('${String(id).replace(/'/g, "\\'")}', 'مقبولة')"
                        >
                            ✅ قبول
                        </button>

                        <button
                            class="reject-btn"
                            onclick="updateClinicStatus('${String(id).replace(/'/g, "\\'")}', 'مرفوضة')"
                        >
                            ❌ رفض
                        </button>

                    `;

                }


                tbody.innerHTML += `

                    <tr>

                        <td>
                            <b>
                                ${safe(c.clinic_name)}
                            </b>
                        </td>

                        <td>
                            ${safe(c.doctor_name)}
                        </td>

                        <td>
                            ${safe(c.specialty)}
                        </td>

                        <td>
                            ${safe(c.address)}
                        </td>

                        <td>
                            ${safe(c.phone)}
                        </td>

                        <td>
                            ${clinicStatus(status)}
                        </td>

                        <td>
                            ${action}
                        </td>

                    </tr>

                `;

            });

        }

        catch (err) {

            console.error(err);

            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="error">
                        ❌ خطأ في تحميل العيادات:
                        ${safe(err.message)}
                    </td>
                </tr>
            `;

        }

    }

       UPDATE CLINIC
    ========================= */
