<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الطبيب البيطري - VetCare</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
    background:#f4f6f8;
    text-align:center;
    margin:0;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    max-width:1000px;
    margin:0 auto 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

#loginCard{
    max-width:450px;
    margin:70px auto;
}

input,button,select{
    padding:10px;
    margin:8px 0;
    border-radius:5px;
    border:1px solid #ccc;
    font-size:16px;
}

input{
    width:90%;
}

button{
    background:#27ae60;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#loginBtn{
    width:95%;
}

#dashboard{
    display:none;
}

.tabs{
    display:flex;
    gap:10px;
    max-width:1000px;
    margin:0 auto 15px;
}

.tab-btn{
    flex:1;
    background:#dfe6e9;
    color:#2c3e50;
    width:auto;
    margin:0;
}

.tab-btn.active{
    background:#27ae60;
    color:white;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.approve-btn{
    background:#2980b9;
    width:auto;
    padding:6px 10px;
    font-size:12px;
    margin:2px;
}

.reject-btn{
    background:#c0392b;
    width:auto;
    padding:6px 10px;
    font-size:12px;
    margin:2px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    font-size:13px;
}

th{
    background:#2c3e50;
    color:white;
}

.message{
    margin-top:10px;
    padding:10px;
    border-radius:6px;
    display:none;
}

.error{
    background:#fdecea;
    color:#c0392b;
}

.success{
    background:#eafaf1;
    color:#27ae60;
}

.status{
    font-weight:bold;
}

.refresh{
    width:auto;
    padding:8px 15px;
}

.logout{
    background:#7f8c8d;
    width:auto;
    padding:8px 15px;
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .tabs{
        flex-direction:column;
    }

    table{
        min-width:750px;
    }

}
</style>

</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<div class="card" id="loginCard">

    <h2>🔑 دخول الطبيب / الأدمن</h2>

    <p>
        أدخل كلمة المرور للدخول إلى لوحة التحكم
    </p>

    <input
        type="password"
        id="passInput"
        placeholder="أدخل كلمة السر"
        autocomplete="current-password"
    >

    <button
        id="loginBtn"
        type="button"
        onclick="login()"
    >
        دخول
    </button>

    <div
        id="loginMessage"
        class="message error"
    ></div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div id="dashboard">

    <div class="tabs">

        <button
            class="tab-btn active"
            id="tabCasesBtn"
            type="button"
            onclick="switchTab('cases')"
        >
            🩺 الحالات الواردة
        </button>

        <button
            class="tab-btn"
            id="tabClinicsBtn"
            type="button"
            onclick="switchTab('clinics')"
        >
            🏥 طلبات انضمام العيادات
        </button>

    </div>


    <!-- =====================
         CASES
    ====================== -->

    <div
        class="card tab-content active"
        id="tab-cases"
    >

        <h2>🩺 الحالات البيطرية الواردة</h2>

        <button
            class="refresh"
            type="button"
            onclick="loadCases()"
        >
            🔄 تحديث البيانات
        </button>

        <div style="overflow-x:auto;">

            <table>

                <thead>

                    <tr>

                        <th>رقم الطلب</th>

                        <th>الاسم</th>

                        <th>الهاتف</th>

                        <th>الحيوان</th>

                        <th>الطبيب</th>

                        <th>الخدمة</th>

                        <th>الوصف</th>

                        <th>الحالة</th>

                        <th>تحديث</th>

                    </tr>

                </thead>

                <tbody id="casesTable">

                    <tr>
                        <td colspan="9">
                            جاري التحميل...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- =====================
         CLINICS
    ====================== -->

    <div
        class="card tab-content"
        id="tab-clinics"
    >

        <h2>🏥 طلبات انضمام العيادات</h2>

        <button
            class="refresh"
            type="button"
            onclick="loadClinics()"
        >
            🔄 تحديث البيانات
        </button>

        <div style="overflow-x:auto;">

            <table>

                <thead>

                    <tr>

                        <th>اسم العيادة</th>

                        <th>الطبيب المسؤول</th>

                        <th>التخصص</th>

                        <th>العنوان</th>

                        <th>المدينة</th>

                        <th>الهاتف</th>

                        <th>الحالة</th>

                        <th>إجراء</th>

                    </tr>

                </thead>

                <tbody id="clinicsTable">

                    <tr>
                        <td colspan="8">
                            جاري التحميل...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <div class="card">

        <button
            class="logout"
            type="button"
            onclick="logout()"
        >
            تسجيل الخروج
        </button>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
'https://tuyvjozypjcvgpgkfoby.supabase.co';

const SUPABASE_KEY =
'sb_publishable_tJeAmG5w9tJth0rkMmwyrw_Ebel2qit';

const _supabase =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   LOGIN
========================= */

function login(){

    const input =
        document.getElementById(
            'passInput'
        );

    const message =
        document.getElementById(
            'loginMessage'
        );

    const pass =
        input.value.trim();


    if(!pass){

        message.style.display =
            'block';

        message.textContent =
            '⚠️ اكتب كلمة السر أولًا';

        return;

    }


    if(pass === 'vetcare2026#'){

        sessionStorage.setItem(
            'vetcare_logged_in',
            'true'
        );


        document.getElementById(
            'loginCard'
        ).style.display =
            'none';


        document.getElementById(
            'dashboard'
        ).style.display =
            'block';


        loadCases();

        loadClinics();

    }
    else{

        message.style.display =
            'block';

        message.textContent =
            '❌ كلمة السر غير صحيحة';

        input.value = '';

        input.focus();

    }

}


/* =========================
   ENTER LOGIN
========================= */

document
    .getElementById('passInput')
    .addEventListener(
        'keydown',
        function(event){

            if(event.key === 'Enter'){

                event.preventDefault();

                login();

            }

        }
    );


/* =========================
   LOGOUT
========================= */

function logout(){

    sessionStorage.removeItem(
        'vetcare_logged_in'
    );

    location.reload();

}


/* =========================
   TABS
========================= */

function switchTab(tab){

    document
        .getElementById('tab-cases')
        .classList.toggle(
            'active',
            tab === 'cases'
        );


    document
        .getElementById('tab-clinics')
        .classList.toggle(
            'active',
            tab === 'clinics'
        );


    document
        .getElementById('tabCasesBtn')
        .classList.toggle(
            'active',
            tab === 'cases'
        );


    document
        .getElementById('tabClinicsBtn')
        .classList.toggle(
            'active',
            tab === 'clinics'
        );

}


/* =========================
   LOAD CASES
========================= */

async function loadCases(){

    const tbody =
        document.getElementById(
            'casesTable'
        );


    tbody.innerHTML = `
        <tr>
            <td colspan="9">
                ⏳ جاري جلب الحالات...
            </td>
        </tr>
    `;


    try{

        const {
            data,
            error
        } =
            await _supabase
                .from('cases')
                .select('*')
                .order(
                    'id',
                    {
                        ascending:false
                    }
                );


        if(error){

            throw error;

        }


        if(
            !data ||
            data.length === 0
        ){

            tbody.innerHTML = `
                <tr>
                    <td colspan="9">
                        لا توجد حالات مسجلة حتى الآن
                    </td>
                </tr>
            `;

            return;

        }


        tbody.innerHTML = '';


        data.forEach(
            function(c){

                tbody.innerHTML += `

                    <tr>

                        <td>
                            <b>
                                ${safe(
                                    c.order_number
                                )}
                            </b>
                        </td>

                        <td>
                            ${safe(
                                c.owner_name
                            )}
                        </td>

                        <td>
                            ${safe(
                                c.phone
                            )}
                        </td>

                        <td>
                            ${safe(
                                c.animal_type
                            )}

                            ${
                                c.pet_name
                                ?
                                '(' +
                                safe(c.pet_name) +
                                ')'
                                :
                                ''
                            }
                        </td>

                        <td>
                            ${safe(
                                c.doctor_name
                            )}
                        </td>

                        <td>
                            ${safe(
                                c.service_type
                            )}
                        </td>

                        <td>
                            ${safe(
                                c.description
                            )}
                        </td>

                        <td>

                            <span class="status">

                                ${safe(
                                    c.status ||
                                    'قيد الانتظار'
                                )}

                            </span>

                        </td>

                        <td>

                            <select
                                onchange="
                                    updateCaseStatus(
                                        ${c.id},
                                        this.value
                                    )
                                "
                            >

                                <option
                                    value=""
                                    disabled
                                    selected
                                >
                                    تغيير...
                                </option>

                                <option value="قيد الانتظار">
                                    قيد الانتظار
                                </option>

                                <option value="جاري التواصل">
                                    جاري التواصل
                                </option>

                                <option value="تم الرد">
                                    تم الرد
                                </option>

                                <option value="مغلقة">
                                    مغلقة
                                </option>

                            </select>

                        </td>

                    </tr>

                `;

            }
        );

    }
    catch(error){

        console.error(
            error
        );


        tbody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    style="color:red"
                >
                    ❌ خطأ:
                    ${safe(error.message)}
                </td>
            </tr>
        `;

    }

}


/* =========================
   LOAD CLINICS
========================= */

async function loadClinics(){

    const tbody =
        document.getElementById(
            'clinicsTable'
        );


    tbody.innerHTML = `
        <tr>
            <td colspan="8">
                ⏳ جاري جلب العيادات...
            </td>
        </tr>
    `;


    try{

        const {
            data,
            error
        } =
            await _supabase
                .from('clinics')
                .select('*')
                .order(
                    'id',
                    {
                        ascending:false
                    }
                );


        if(error){

            throw error;

        }


        if(
            !data ||
            data.length === 0
        ){

            tbody.innerHTML = `
                <tr>
                    <td colspan="8">
                        لا توجد طلبات انضمام حتى الآن
                    </td>
                </tr>
            `;

            return;

        }


        tbody.innerHTML = '';


        data.forEach(
            function(c){

                const status =
                    c.status ||
                    'قيد المراجعة';


                tbody.innerHTML += `

                    <tr>

                        <td>
                            <b>
                                ${safe(
                                    c.clinic_name
                                )}
                            </b>
                        </td>

                        <td>
                            ${safe(
                                c.doctor_name
                            )}
                        </td>

                        <td>
                            ${safe(
                                c.specialty
                            )}
                        </td>

                        <td>
                            ${safe(
                                c.address
                            )}
                        </td>

                        <td>
                            ${safe(
                                c.city
                            )}
                        </td>

                        <td>
                            ${safe(
                                c.phone
                            )}
                        </td>

                        <td>

                            <span class="status">

                                ${safe(
                                    status
                                )}

                            </span>

                        </td>

                        <td>

                            <button
                                class="approve-btn"
                                type="button"
                                onclick="
                                    updateClinicStatus(
                                        ${c.id},
                                        'مقبولة'
                                    )
                                "
                            >
                                قبول
                            </button>


                            <button
                                class="reject-btn"
                                type="button"
                                onclick="
                                    updateClinicStatus(
                                        ${c.id},
                                        'مرفوضة'
                                    )
                                "
                            >
                                رفض
                            </button>

                        </td>

                    </tr>

                `;

            }
        );

    }
    catch(error){

        console.error(
            error
        );


        tbody.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    style="color:red"
                >
                    ❌ خطأ:
                    ${safe(error.message)}
                </td>
            </tr>
        `;

    }

}


/* =========================
   UPDATE CASE
========================= */

async function updateCaseStatus(
    id,
    newStatus
){

    const {
        error
    } =
        await _supabase
            .from('cases')
            .update({
                status:newStatus
            })
            .eq(
                'id',
                id
            );


    if(error){

        alert(
            '❌ خطأ في تحديث الحالة:\n' +
            error.message
        );

        return;

    }


    loadCases();

}


/* =========================
   UPDATE CLINIC
========================= */

async function updateClinicStatus(
    id,
    newStatus
){

    const {
        error
    } =
        await _supabase
            .from('clinics')
            .update({
                status:newStatus
            })
            .eq(
                'id',
                id
            );


    if(error){

        alert(
            '❌ خطأ في تحديث العيادة:\n' +
            error.message
        );

        return;

    }


    loadClinics();

}


/* =========================
   SAFE HTML
========================= */

function safe(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '-';

    }


    return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

}


/* =========================
   AUTO LOGIN
========================= */

window.addEventListener(
    'DOMContentLoaded',
    function(){

        const loggedIn =
            sessionStorage.getItem(
                'vetcare_logged_in'
            );


        if(loggedIn === 'true'){

            document.getElementById(
                'loginCard'
            ).style.display =
                'none';


            document.getElementById(
                'dashboard'
            ).style.display =
                'block';


            loadCases();

            loadClinics();

        }

    }
);

</script>

</body>
</html>
