
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استعادة كلمة المرور | Vet Care</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:Tajawal}
body{margin:0;background:#f5f7f9;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{background:white;padding:25px;border-radius:18px;width:100%;max-width:420px;box-shadow:0 5px 25px #0001}
h2{text-align:center;color:#059669}
p{text-align:center;color:#666;line-height:1.8}
input,button{width:100%;padding:14px;margin-top:13px;border-radius:10px;font-size:15px}
input{border:1px solid #ddd}
button{background:#10b981;color:white;border:0;font-weight:bold;cursor:pointer}
#message{margin-top:15px;text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="card">
<h2>🐾 Vet Care</h2>
<h3 style="text-align:center">تغيير كلمة المرور</h3>
<p>أدخل كلمة المرور الجديدة لحسابك</p>

<input id="password" type="password" placeholder="كلمة المرور الجديدة">
<input id="confirm" type="password" placeholder="تأكيد كلمة المرور">

<button id="save" onclick="changePassword()">حفظ كلمة المرور</button>
<div id="message"></div>
</div>

<script>
const SUPABASE_URL='https://tuyvjozypjcvgpgkfoby.supabase.co';
const SUPABASE_KEY='sb_publishable_tJeAmG5w9tJth0rkMmwyrw_Ebel2qit';

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    detectSessionInUrl:true,
    persistSession:true,
    autoRefreshToken:true
  }
});

const msg=document.getElementById('message');

async function checkSession(){
  const {data,error}=await db.auth.getSession();

  if(error){
    msg.style.color='red';
    msg.textContent='حدث خطأ: '+error.message;
    return;
  }

  if(!data.session){
    msg.style.color='red';
    msg.textContent='رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا.';
    document.getElementById('save').disabled=true;
  }
}

async function changePassword(){
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  const btn=document.getElementById('save');

  if(password.length<8){
    msg.style.color='red';
    msg.textContent='كلمة المرور يجب أن تكون 8 أحرف على الأقل';
    return;
  }

  if(password!==confirm){
    msg.style.color='red';
    msg.textContent='كلمتا المرور غير متطابقتين';
    return;
  }

  btn.disabled=true;
  btn.textContent='جاري الحفظ...';

  try{
    const {data,error}=await db.auth.updateUser({password});

    if(error) throw error;

    msg.style.color='#059669';
    msg.textContent='تم تغيير كلمة المرور بنجاح ✅';

    document.getElementById('password').value='';
    document.getElementById('confirm').value='';

    setTimeout(()=>{
      window.location.href='index.html';
    },2500);

  }catch(error){
    msg.style.color='red';
    msg.textContent='تعذر تغيير كلمة المرور: '+error.message;
    btn.disabled=false;
    btn.textContent='حفظ كلمة المرور';
  }
}

checkSession();
</script>
</body>
</html>
