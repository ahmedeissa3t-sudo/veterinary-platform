<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VetCare Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}
input,button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:16px;
}
button{
  background:#1769aa;
  color:white;
  border:0;
  cursor:pointer;
}
.logout{
  background:#d32f2f;
}
.stat{
  display:inline-block;
  width:30%;
  margin:1%;
  text-align:center;
}
.stat h2{
  font-size:30px;
  margin:10px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  overflow-x:auto;
}
th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:right;
}
.hidden{display:none}
.message{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
}
.error{background:#ffe5e5;color:#b00000}
.success{background:#e5ffe9;color:#08752a}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h2>🔐 دخول الأدمن</h2>

  <input id="email" type="email" placeholder="الإيميل">

  <input id="password" type="password" placeholder="الباسورد">

  <button onclick="login()">دخول</button>

  <button onclick="forgotPassword()">
    نسيت الباسورد؟
  </button>

  <div id="loginMessage"></div>
</div>


<!-- RESET PASSWORD -->
<div id="resetBox" class="card hidden">
  <h2>🔑 تغيير الباسورد</h2>
