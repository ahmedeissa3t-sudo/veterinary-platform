<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VetCare Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

input{
    border:1px solid #ddd;
}

button{
    border:0;
    background:#1769aa;
    color:white;
    cursor:pointer;
}

.logout{
    background:#d32f2f;
}

.hidden{
    display:none;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:8px;
}

.error{
    background:#ffe5e5;
    color:#b00000;
}

.success{
    background:#e5ffe9;
    color:#08752a;
}

.stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.stat{
    flex:1;
    min-width:150px;
    text-align:center;
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:right;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">

<h2>🔐 دخول الأدمن</h2>

<input id="email" type="email" placeholder="الإيميل">

<input id="password" type="password" placeholder="الباسورد">

<button id="loginButton">دخول</button>

<button id="forgotButton">نسيت الباسورد؟</button>

<div id="loginMessage"></div>

</div>


<!-- RESET PASSWORD -->
<div id="resetBox" class="card hidden">

<h2>🔑 تغيير الباسورد</h2>

<p>اكتب الباسورد الجديد.</p>

<input id="newPassword" type="password" placeholder="الباسورد الجديد">

<input id="confirmPassword" type="password" placeholder="تأكيد الباسورد">

<button id="updateButton">حفظ الباسورد الجديد</button>

<div id="resetMessage"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="card">

<h1>🐾 VetCare Admin Dashboard</h1>

<p>أهلاً بيك يا Admin 👑</p>

<button id="logoutButton" class="logout">تسجيل خروج</button>

</div>


<div class="card stats">

<div class="stat">
<h2 id="casesCount">0</h2>
<p>الحالات</p>
</div>

<div class="stat">
<h2 id="clinicsCount">0</h2>
<p>العيادات</p>
</div>

<div class="stat">
<h2 id="doctorsCount">0</h2>
<p>الدكاترة</p>
</div>

</div>


<div class="card">

<h2>📋 الحالات</h2>

<div style="overflow-x:auto">

<table>

<thead>
<tr>
<th>رقم الطلب</th>
<th>المالك</th>
<th>التليفون</th>
<th>الحيوان</th>
<th>الدكتور</th>
<th>الخدمة</th>
<th>الحالة</th>
</tr>
</thead>

<tbody id="casesTable"></tbody>

</table>

</div>

</div>


<div class="card">

<h2>🏥 العيادات</h2>

<div style="overflow-x:auto">

<table>

<thead>
<tr>
<th>اسم العيادة</th>
<th>المدينة</th>
<th>الدكتور</th>
<th>الحالة</th>
</tr>
</thead>

<tbody id="clinicsTable"></tbody>

</table>

</div>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://tuyvjozypjcvgpgkfoby.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tJeAmG5w9tJth0rkMmwyrw_Ebel2qit";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* LOGIN */

document.getElementById("loginButton").addEventListener("click", login);

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("loginMessage");

if(!email || !password){

message.className="message error";
message.innerText="اكتب الإيميل والباسورد الأول.";
return;

}

const { data, error } =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){

message.className="message error";
message.innerText="الإيميل أو الباسورد غلط.";
return;

}

await checkAdmin();

}


/* CHECK ADMIN */

async function checkAdmin(){

const { data, error } =
await supabaseClient.auth.getUser();

if(error || !data.user){

showLogin();
return;

}

const user = data.user;

const { data: profile, error: profileError } =
await supabaseClient
.from("profiles")
.select("role")
.eq("id", user.id)
.single();

if(profileError || !profile){

await supabaseClient.auth.signOut();

showLogin();

alert("لم يتم العثور على حساب الأدمن.");

return;

}

if(profile.role !== "admin"){

await supabaseClient.auth.signOut();

showLogin();

alert("هذا الحساب ليس Admin.");

return;

}

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("resetBox")
.classList.add("hidden");

document
.getElementById("dashboard")
.classList.remove("hidden");

loadDashboard();

}


/* FORGOT PASSWORD */

document
.getElementById("forgotButton")
.addEventListener("click", forgotPassword);

async function forgotPassword(){

const email =
document.getElementById("email").value.trim();

const message =
document.getElementById("loginMessage");

if(!email){

message.className="message error";
message.innerText="اكتب الإيميل الأول.";
return;

}

const { error } =
await supabaseClient.auth.resetPasswordForEmail(
email,
{
redirectTo:
"https://ahmedeissa3t-sudo.github.io/veterinary-platform/admin.html"
}
);

if(error){

message.className="message error";
message.innerText="حصل خطأ: " + error.message;
return;

}

message.className="message success";
message.innerText=
"تم إرسال رابط تغيير الباسورد على الإيميل ✅";

}


/* RESET PASSWORD */

document
.getElementById("updateButton")
.addEventListener("click", updatePassword);

async function updatePassword(){

const password =
document.getElementById("newPassword").value;

const confirm =
document.getElementById("confirmPassword").value;

const message =
document.getElementById("resetMessage");

if(password.length < 6){

message.className="message error";
message.innerText=
"الباسورد لازم يكون 6 حروف على الأقل.";

return;

}

if(password !== confirm){

message.className="message error";
message.innerText=
"الباسوردين مش متطابقين.";

return;

}

const { error } =
await supabaseClient.auth.updateUser({
password:password
});

if(error){

message.className="message error";
message.innerText=
"حصل خطأ: " + error.message;

return;

}

message.className="message success";
message.innerText=
"تم تغيير الباسورد بنجاح ✅";

setTimeout(checkAdmin,1000);

}


/* DASHBOARD */

async function loadDashboard(){

await loadCases();
await loadClinics();
await loadDoctors();

}


/* CASES */

async function loadCases(){

const { data, error } =
await supabaseClient
.from("cases")
.select("*")
.order("created_at",{ascending:false});

if(error){

console.log(error);
return;

}

const cases = data || [];

document.getElementById("casesCount").innerText =
cases.length;

const table =
document.getElementById("casesTable");

table.innerHTML="";

cases.forEach(function(c){

table.innerHTML += `
<tr>
<td>${c.order_number || "-"}</td>
<td>${c.owner_name || "-"}</td>
<td>${c.phone || "-"}</td>
<td>${c.animal_type || "-"}</td>
<td>${c.doctor_name || "-"}</td>
<td>${c.service_type || "-"}</td>
<td>${c.status || "-"}</td>
</tr>
`;

});

}


/* CLINICS */

async function loadClinics(){

const { data, error } =
await supabaseClient
.from("clinics")
.select("*")
.order("created_at",{ascending:false});

if(error){

console.log(error);
return;

}

const clinics = data || [];

document.getElementById("clinicsCount").innerText =
clinics.length;

const table =
document.getElementById("clinicsTable");

table.innerHTML="";

clinics.forEach(function(c){

table.innerHTML += `
<tr>
<td>${c.clinic_name || "-"}</td>
<td>${c.city || "-"}</td>
<td>${c.doctor_name || "-"}</td>
<td>${c.status || "-"}</td>
</tr>
`;

});

}


/* DOCTORS */

async function loadDoctors(){

const { count, error } =
await supabaseClient
.from("profiles")
.select("*",{count:"exact",head:true})
.eq("role","doctor");

if(error){

console.log(error);
return;

}

document.getElementById("doctorsCount").innerText =
count || 0;

}


/* LOGOUT */

document
.getElementById("logoutButton")
.addEventListener("click", logout);

async function logout(){

await supabaseClient.auth.signOut();

showLogin();

}


/* SHOW LOGIN */

function showLogin(){

document
.getElementById("dashboard")
.classList.add("hidden");

document
.getElementById("resetBox")
.classList.add("hidden");

document
.getElementById("loginBox")
.classList.remove("hidden");

}


/* PASSWORD RECOVERY */

supabaseClient.auth.onAuthStateChange(
function(event,session){

if(event === "PASSWORD_RECOVERY"){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("dashboard")
.classList.add("hidden");

document
.getElementById("resetBox")
.classList.remove("hidden");

}

});


/* PAGE LOAD */

window.addEventListener("load", async function(){

const hash = window.location.hash;

if(hash.includes("type=recovery")){

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("resetBox")
.classList.remove("hidden");

return;

}

const { data } =
await supabaseClient.auth.getSession();

if(data.session){

await checkAdmin();

}else{

showLogin();

}

});

</script>

</body>
    </html>
